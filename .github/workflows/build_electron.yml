name: Chronous build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macOS-26

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron - Build app
        env:
          # No Apple/code-signing secrets exist in this fork's repo. Deliberately NOT setting
          # CSC_LINK/CSC_KEY_PASSWORD/APPLE_* here at all: ${{ secrets.X }} for a secret that
          # doesn't exist evaluates to an empty string, not "unset" - electron-builder then
          # treats that empty CSC_LINK as a certificate file path, resolves it to the current
          # working directory (apps/electron), and crashes trying to stat a directory as a
          # file ("apps/electron not a file"). CSC_IDENTITY_AUTO_DISCOVERY alone did not fix
          # this - confirmed via CI logs that the crash happens before that check is even
          # reached. Omitting the env vars avoids the empty-string problem at its source.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm dist-mac --env-mode=loose
        timeout-minutes: 60

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chronous-macos-build
          path: |
            ./apps/electron/dist/chronous-macOS-x64.dmg
            ./apps/electron/dist/chronous-macOS-arm64.dmg
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./apps/electron/dist/chronous-macOS-x64.dmg
            ./apps/electron/dist/chronous-macOS-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron - Build app
        run: pnpm dist-win

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chronous-windows-build
          path: |
            ./apps/electron/dist/chronous-win-x64.exe
            ./apps/electron/dist/chronous-win-arm64.exe
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./apps/electron/dist/chronous-win-x64.exe
            ./apps/electron/dist/chronous-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron - Build app
        run: pnpm dist-linux

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chronous-linux-build
          path: |
            ./apps/electron/dist/chronous-linux-x86_64.AppImage
            ./apps/electron/dist/chronous-linux-arm64.AppImage
            ./apps/electron/dist/chronous-linux-armv7l.AppImage
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./apps/electron/dist/chronous-linux-x86_64.AppImage
            ./apps/electron/dist/chronous-linux-arm64.AppImage
            ./apps/electron/dist/chronous-linux-armv7l.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
